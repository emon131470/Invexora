<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - INVEXORA</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<header class="header">
    <a href="index.html" class="logo"><img src="logo.svg" alt="INVEXORA" style="display:block;height:40px;width:auto"></a>
</header>
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-title">
            <span>WELCOME BACK</span>
            <h1>Login</h1>
            <p>Enter your email. We will send you a one-time code.</p>
        </div>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required autocomplete="email" placeholder="example@gmail.com">
            </div>
            <button type="submit" class="full-btn">Send Login Code</button>
            <p class="form-bottom">Don't have an account? <a href="register.html">Register</a></p>
        </form>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
