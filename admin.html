<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Admin Panel - INVEXORA</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0a0e17; --bg-deep: #0b0f19; --surface: #111827; --surface-2: #182033;
            --line: rgba(180,200,255,0.10); --line-strong: rgba(180,200,255,0.20);
            --text: #f5f7fb; --muted: #8b94a7; --faint: #5d667a;
            --gold: #c8ff1e; --gold-light: #c8ff1e; --gold-ink: #0a0e17;
            --good: #c8ff1e; --bad: #ff6b6b;
            --serif: "Space Grotesk", "Segoe UI", Arial, sans-serif;
            --sans: "Space Grotesk", "Segoe UI", Arial, sans-serif;
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

        [hidden] { display: none !important; }

        h1, h2 { font-family: var(--serif); font-weight: 600; }

        button { font-family: inherit; cursor: pointer; }

        .btn { padding: 11px 22px; border-radius: 10px; border: 1px solid transparent; background: linear-gradient(135deg, #d2ff3a, #b8f200); color: var(--gold-ink); font-size: 14px; font-weight: 600; transition: 0.25s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200,255,30,0.30); }

        .btn-ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
        .btn-ghost:hover { border-color: var(--gold); color: var(--gold-light); box-shadow: none; }

        /* ---------- LOGIN ---------- */
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at 50% 0%, rgba(200,255,30,0.16), transparent 50%), var(--bg); }

        .login-box { width: 100%; max-width: 420px; padding: 40px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line-strong); border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }

        .login-box .tag { display: block; margin: 18px 0 6px; color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: 1.8px; }

        .login-box h1 { font-size: 30px; margin-bottom: 26px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 13px; }
        .field input { width: 100%; padding: 13px 15px; border-radius: 10px; border: 1px solid var(--line-strong); background: #0b0f19; color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
        .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,255,30,0.18); }

        .login-box .btn { width: 100%; padding: 14px; margin-top: 6px; }
        .err { min-height: 20px; margin-top: 12px; color: var(--bad); font-size: 13px; }

        /* ---------- PANEL ---------- */
        .topbar { height: 72px; padding: 0 5%; display: flex; align-items: center; justify-content: space-between; background: var(--bg-deep); border-bottom: 1px solid var(--line); }
        .topbar .right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-tag { font-size: 12px; color: var(--faint); letter-spacing: 1.5px; }

        .wrap { max-width: 1250px; margin: 0 auto; padding: 44px 24px 70px; }

        .head h1 { font-size: 34px; }
        .head p { color: var(--muted); margin-bottom: 30px; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 34px; }
        .stat { padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
        .stat small { display: block; color: var(--faint); font-size: 13px; margin-bottom: 8px; }
        .stat strong { font-family: var(--serif); font-size: 30px; font-weight: 600; }

        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        .tabs { display: flex; gap: 8px; }
        .tab { padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; transition: 0.25s; }
        .tab.active { background: var(--surface-2); border-color: var(--gold); color: var(--gold-light); }

        .search { width: 280px; max-width: 100%; padding: 11px 15px; border-radius: 10px; border: 1px solid var(--line-strong); background: #0b0f19; color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
        .search:focus { border-color: var(--gold); }

        .table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 15px 18px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--line); }
        th { color: var(--faint); font-size: 12px; font-weight: 600; letter-spacing: 1px; background: #182033; }
        tr:last-child td { border-bottom: none; }
        td.muted { color: var(--muted); }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.Pending  { background: rgba(255,196,71,0.14); color: #ffc447; }
        .badge.Approved { background: rgba(200,255,30,0.12); color: #c8ff1e; }
        .badge.Rejected { background: rgba(255,107,107,0.14); color: #ff6b6b; }

        .act { display: flex; gap: 8px; }
        .act button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--text); font-size: 12px; transition: 0.25s; }
        .act .ok:hover  { border-color: var(--good); color: var(--good); }
        .act .no:hover  { border-color: var(--bad);  color: var(--bad); }

        .empty { padding: 50px 24px; text-align: center; color: var(--muted); font-size: 14px; }

        @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 520px) { .stats { grid-template-columns: 1fr; } .login-box { padding: 28px; } }

        .cell-input { width: 90px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: #0b0f19; color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
        .cell-input:focus { border-color: var(--gold-light); }

        .toast { min-height: 22px; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
        .toast.err { color: var(--bad); }
        .toast.ok  { color: var(--good); }

        .settings-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
        .settings-row label { color: var(--muted); font-size: 14px; font-weight: 500; }

        .small { font-size: 12px; color: var(--faint); }
    </style>

</head>

<script src="app.js"></script>

<script>

    var ctx = null;
    var currentTab = "deposits";
    var cache = { deposits: [], withdrawals: [], users: [], plans: [], settings: null };

    function $(id) { return document.getElementById(id); }

    function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                                         .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function money(n) {
        return "$" + Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
    }

    function fmtDate(d) {
        var x = new Date(d);
        return isNaN(x) ? "-" : x.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function cap(s) {
        s = String(s || "");
        return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function toast(text, ok) {
        $("toast").textContent = text || "";
        $("toast").className = "toast " + (text ? (ok ? "ok" : "err") : "");
    }

    function userLabel(p) {
        if (!p) return "<span class='muted'>-</span>";
        var name = ((p.first_name || "") + " " + (p.last_name || "")).trim();
        return esc(name || p.email) + "<div class='small'>" + esc(p.email) + "</div>";
    }


    /* ===== LOGIN ===== */
    function showLogin(note) {
        $("panelView").hidden = true;
        $("loginView").hidden = false;
        $("loginErr").textContent = note || "";
    }

    async function showPanel() {
        $("loginView").hidden = true;
        $("panelView").hidden = false;
        $("adminName").textContent = ctx.profile ? ctx.profile.email : "";
        await refresh();
    }

    async function isAdminNow() {

        var s = (await ctx.sb.auth.getSession()).data.session;
        if (!s) return false;

        var p = await ctx.sb.from("profiles").select("*").eq("id", s.user.id).maybeSingle();
        ctx.session = s;
        ctx.profile = p.data || null;

        return !!(ctx.profile && ctx.profile.role === "admin");
    }

    $("adminLoginForm").addEventListener("submit", async function (e) {

        e.preventDefault();

        var btn = $("adminLoginBtn");
        btn.disabled = true;
        $("loginErr").textContent = "";

        var res = await IPAuth.login($("adminEmail").value);

        if (!res.ok) {
            $("loginErr").textContent = res.error;
            btn.disabled = false;
            return;
        }

        if (!(await isAdminNow())) {
            await ctx.sb.auth.signOut();
            $("loginErr").textContent = "This account is not an admin.";
            btn.disabled = false;
            return;
        }

        btn.disabled = false;
        showPanel();
    });

    $("logoutBtn").addEventListener("click", async function () {
        await ctx.sb.auth.signOut();
        showLogin();
    });


    /* ===== LOAD DATA ===== */
    async function loadStats() {

        var r = await ctx.sb.rpc("admin_stats");
        if (r.error) { toast(r.error.message, false); return; }

        $("statUsers").textContent       = r.data.users;
        $("statDeposits").textContent    = r.data.pending_deposits;
        $("statWithdrawals").textContent = r.data.pending_withdrawals;
        $("statAmount").textContent      = money(r.data.approved_deposits);
    }

    async function loadTab() {

        var sb = ctx.sb, r;

        if (currentTab === "deposits") {
            r = await sb.from("deposits")
                .select("*, plans(name), profiles!deposits_user_id_fkey(email, first_name, last_name)")
                .order("created_at", { ascending: false });
            if (!r.error) cache.deposits = r.data;
        }

        if (currentTab === "withdrawals") {
            r = await sb.from("withdrawals")
                .select("*, profiles!withdrawals_user_id_fkey(email, first_name, last_name)")
                .order("created_at", { ascending: false });
            if (!r.error) cache.withdrawals = r.data;
        }

        if (currentTab === "users") {
            r = await sb.from("profiles").select("*").order("created_at", { ascending: false });
            if (!r.error) cache.users = r.data;
        }

        if (currentTab === "plans") {
            r = await sb.from("plans").select("*").order("sort_order");
            if (!r.error) cache.plans = r.data;

            var st = await sb.from("settings").select("*").eq("id", 1).maybeSingle();
            if (st.data) { cache.settings = st.data; $("minWithdraw").value = st.data.min_withdraw; }
        }

        if (r && r.error) toast("Could not load data: " + r.error.message, false);
    }

    async function refresh() {
        await Promise.all([loadStats(), loadTab()]);
        render();
    }


    /* ===== RENDER ===== */
    function render() {

        $("settingsRow").hidden = (currentTab !== "plans");

        var q = $("searchBox").value.trim().toLowerCase();

        if (currentTab === "deposits")    renderDeposits(q);
        if (currentTab === "withdrawals") renderWithdrawals(q);
        if (currentTab === "users")       renderUsers(q);
        if (currentTab === "plans")       renderPlans();
    }

    function matches(obj, q) {
        return !q || JSON.stringify(obj).toLowerCase().indexOf(q) > -1;
    }

    function actionButtons(kind, id) {
        return "<div class='act'>" +
            "<button class='ok' data-kind='" + kind + "' data-id='" + id + "' data-approve='true'>Approve</button>" +
            "<button class='no' data-kind='" + kind + "' data-id='" + id + "' data-approve='false'>Reject</button>" +
            "</div>";
    }

    function renderDeposits(q) {

        var rows = cache.deposits.filter(function (d) { return matches(d, q); });

        if (!rows.length) { $("tableBox").innerHTML = '<div class="empty">No deposit requests.</div>'; return; }

        var html = "<table><thead><tr><th>DATE</th><th>USER</th><th>PLAN</th><th>AMOUNT</th><th>NOTE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>";

        rows.forEach(function (d) {
            var st = cap(d.status);
            html += "<tr>" +
                "<td class='muted'>" + fmtDate(d.created_at) + "</td>" +
                "<td>" + userLabel(d.profiles) + "</td>" +
                "<td>" + esc(d.plans ? d.plans.name : d.plan_id) + "</td>" +
                "<td><b>" + money(d.amount) + "</b></td>" +
                "<td class='muted'>" + esc(d.note || "-") + "</td>" +
                "<td><span class='badge " + st + "'>" + st + "</span></td>" +
                "<td>" + (d.status === "pending" ? actionButtons("deposit", d.id) : "<span class='small'>Reviewed</span>") + "</td>" +
                "</tr>";
        });

        $("tableBox").innerHTML = html + "</tbody></table>";
    }

    function renderWithdrawals(q) {

        var rows = cache.withdrawals.filter(function (w) { return matches(w, q); });

        if (!rows.length) { $("tableBox").innerHTML = '<div class="empty">No withdrawal requests.</div>'; return; }

        var html = "<table><thead><tr><th>DATE</th><th>USER</th><th>AMOUNT</th><th>NOTE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>";

        rows.forEach(function (w) {
            var st = cap(w.status);
            html += "<tr>" +
                "<td class='muted'>" + fmtDate(w.created_at) + "</td>" +
                "<td>" + userLabel(w.profiles) + "</td>" +
                "<td><b>" + money(w.amount) + "</b></td>" +
                "<td class='muted'>" + esc(w.note || "-") + "</td>" +
                "<td><span class='badge " + st + "'>" + st + "</span></td>" +
                "<td>" + (w.status === "pending" ? actionButtons("withdrawal", w.id) : "<span class='small'>Reviewed</span>") + "</td>" +
                "</tr>";
        });

        $("tableBox").innerHTML = html + "</tbody></table>";
    }

    function renderUsers(q) {

        var byId = {};
        cache.users.forEach(function (u) { byId[u.id] = u; });

        var rows = cache.users.filter(function (u) { return matches(u, q); });

        if (!rows.length) { $("tableBox").innerHTML = '<div class="empty">No users.</div>'; return; }

        var html = "<table><thead><tr><th>NAME</th><th>EMAIL</th><th>PHONE</th><th>REFERRAL CODE</th><th>REFERRED BY</th><th>ROLE</th><th>JOINED</th></tr></thead><tbody>";

        rows.forEach(function (u) {
            var ref = u.referred_by && byId[u.referred_by] ? byId[u.referred_by].email : "-";
            html += "<tr>" +
                "<td>" + esc(((u.first_name || "") + " " + (u.last_name || "")).trim() || "-") + "</td>" +
                "<td class='muted'>" + esc(u.email) + "</td>" +
                "<td class='muted'>" + esc(u.phone || "-") + "</td>" +
                "<td><b>" + esc(u.referral_code) + "</b></td>" +
                "<td class='muted'>" + esc(ref) + "</td>" +
                "<td class='muted'>" + esc(u.role) + "</td>" +
                "<td class='muted'>" + fmtDate(u.created_at) + "</td>" +
                "</tr>";
        });

        $("tableBox").innerHTML = html + "</tbody></table>";
    }

    function renderPlans() {

        if (!cache.plans.length) { $("tableBox").innerHTML = '<div class="empty">No plans found.</div>'; return; }

        var html = "<table><thead><tr><th>PLAN</th><th>MIN $</th><th>MAX $</th><th>DAYS</th><th>DAILY PROFIT %</th><th>REFERRAL %</th><th>ACTIVE</th><th></th></tr></thead><tbody>";

        cache.plans.forEach(function (p) {
            html += "<tr data-plan='" + esc(p.id) + "'>" +
                "<td><b>" + esc(p.name) + "</b></td>" +
                "<td><input class='cell-input' data-f='min'  type='number' step='0.01' value='" + Number(p.min_amount) + "'></td>" +
                "<td><input class='cell-input' data-f='max'  type='number' step='0.01' value='" + Number(p.max_amount) + "'></td>" +
                "<td><input class='cell-input' data-f='days' type='number' step='1'    value='" + Number(p.duration_days) + "'></td>" +
                "<td><input class='cell-input' data-f='rate' type='number' step='0.001' value='" + Number(p.daily_rate) + "'></td>" +
                "<td><input class='cell-input' data-f='ref'  type='number' step='0.001' value='" + Number(p.referral_rate) + "'></td>" +
                "<td><input data-f='active' type='checkbox'" + (p.active ? " checked" : "") + "></td>" +
                "<td><button class='btn' data-save-plan='" + esc(p.id) + "' style='padding:8px 16px;'>Save</button></td>" +
                "</tr>";
        });

        $("tableBox").innerHTML = html + "</tbody></table>" +
            "<p class='small' style='padding:14px 18px;'>Changes apply to NEW approvals only. Plans that already started keep their old rates.</p>";
    }


    /* ===== EVENTS ===== */
    document.querySelectorAll(".tab").forEach(function (btn) {
        btn.addEventListener("click", async function () {
            document.querySelectorAll(".tab").forEach(function (b) { b.classList.remove("active"); });
            btn.classList.add("active");
            currentTab = btn.getAttribute("data-tab");
            $("searchBox").value = "";
            toast("");
            $("tableBox").innerHTML = '<div class="empty">Loading...</div>';
            await loadTab();
            render();
        });
    });

    $("searchBox").addEventListener("input", render);

    $("tableBox").addEventListener("click", async function (e) {

        // approve / reject
        var b = e.target.closest("button[data-kind]");

        if (b) {

            var kind = b.getAttribute("data-kind");
            var approve = b.getAttribute("data-approve") === "true";
            var fn = kind === "deposit" ? "admin_review_deposit" : "admin_review_withdrawal";

            b.disabled = true;

            var r = await ctx.sb.rpc(fn, { p_id: b.getAttribute("data-id"), p_approve: approve });

            if (r.error) {
                toast(r.error.message, false);
                b.disabled = false;
                return;
            }

            toast((approve ? "Approved." : "Rejected."), true);
            await refresh();
            return;
        }

        // save plan
        var s = e.target.closest("button[data-save-plan]");

        if (s) {

            var row = s.closest("tr");
            function val(f) { return row.querySelector("[data-f='" + f + "']"); }

            var rp = await ctx.sb.rpc("admin_update_plan", {
                p_id: s.getAttribute("data-save-plan"),
                p_min: parseFloat(val("min").value),
                p_max: parseFloat(val("max").value),
                p_days: parseInt(val("days").value, 10),
                p_rate: parseFloat(val("rate").value),
                p_ref: parseFloat(val("ref").value),
                p_active: val("active").checked
            });

            toast(rp.error ? rp.error.message : "Plan saved.", !rp.error);
        }
    });

    $("saveSettings").addEventListener("click", async function () {

        var r = await ctx.sb.rpc("admin_update_settings", { p_min_withdraw: parseFloat($("minWithdraw").value) });

        toast(r.error ? r.error.message : "Settings saved.", !r.error);
    });


    /* ===== START ===== */
    IPReady.then(async function (c) {

        ctx = c;

        if (c.session && await isAdminNow()) {
            showPanel();
        } else if (c.session) {
            await c.sb.auth.signOut();
            showLogin("The account you were logged in with is not an admin.");
        } else {
            showLogin();
        }

    }).catch(function () {
        showLogin("Backend is not connected. Check app.js settings.");
    });

</script>

</body>
</html>
