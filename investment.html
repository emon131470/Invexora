<script src="app.js"></script>
<script>
    function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                                         .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function money(n) {
        return "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
    }
    IPReady.then(async function (ctx) {
        var box = document.getElementById("plansContainer");
        var res = await ctx.sb.from("plans").select("*").eq("active", true).order("sort_order");
        if (res.error) {
            box.innerHTML = '<div class="empty" style="grid-column:1/-1;text-align:center;">Could not load plans: ' + esc(res.error.message) + '</div>';
            return;
        }
        if (!res.data.length) {
            box.innerHTML = '<div class="empty" style="grid-column:1/-1;text-align:center;">No plans are available right now.</div>';
            return;
        }
        box.innerHTML = res.data.map(function (p) {
            return '<div class="plan-card' + (p.featured ? ' featured' : '') + '">' +
                (p.featured ? '<div class="popular">POPULAR</div>' : '') +
                '<div class="plan-name">' + esc(p.name).toUpperCase() + '</div>' +
                '<h2>' + money(p.min_amount) + ' - ' + money(p.max_amount) + '</h2>' +
                '<div class="plan-line">Minimum Investment<strong>' + money(p.min_amount) + '</strong></div>' +
                '<div class="plan-line">Maximum Investment<strong>' + money(p.max_amount) + '</strong></div>' +
                '<div class="plan-line">Validity<strong>' + p.duration_days + ' Days</strong></div>' +
                '<div class="plan-line">Daily Profit<strong>' + Number(p.daily_rate) + '%</strong></div>' +
                '<button class="full-btn" data-plan="' + esc(p.id) + '">Select Plan</button>' +
                '</div>';
        }).join("");
    }).catch(function () {});

    document.getElementById("plansContainer").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-plan]");
        if (b) window.location.href = "deposit.html?plan=" + encodeURIComponent(b.getAttribute("data-plan"));
    });
</script>
</body>
</html>
